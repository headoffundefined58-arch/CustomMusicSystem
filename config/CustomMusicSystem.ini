; CustomMusicSystem 2.6 配置文件 / runtime settings
; 位置：SKSE\Plugins\CustomMusicSystem.ini（必须和 dll 同级）
; 格式：key = value；分号后是注释；段名只是为了好读，代码不看段名。
; 菜单里能改的项都标了「菜单可改」；只在这里能改的项标了「仅 INI」。
; 在游戏里点「保存到 INI」会按本文件的格式重写它，旧文件保留为 .bak。

[Audio]
; 音乐总开关（菜单可改）：0 = 本插件停止播放，播放权交还原版音乐；主音量保留。
bEnabled          = 1
bMixerAutosave    = 1     ; 音量改动约 1 秒后写入混音文件（菜单可改）
; 战斗只降低环境层音量，从不中断它。1.00 = 完全不压（两套音乐并行）；
; 0.00 = 环境层完全让出（正在播的曲子会被战斗音乐顶掉）。默认 0.35 属于「让位但不打断」。
fFadeSwap         = 0.35  ; 事件接管时旧曲淡出秒数；旧曲静音后才播新曲，永不并发（菜单可改）
bDuckInDialogue   = 1     ; 对话期间压低环境层（菜单可改）
fDialogueDuck     = 0.45  ; 对话期间环境层增益（菜单可改）
fChangeSmooth     = 0.30  ; 增益变化的平滑时间，防止滑块拖动时爆音（仅 INI）

[Transition]
; 等功率交叉淡化时长（秒）。所有切换都是交叉淡化，没有硬切。
fFadeLocation    = 3.0    ; 场景或时段切换（菜单可改）
fFadeCombatEnter = 1.2    ; 战斗层淡入（菜单可改）
fFadeCombatExit  = 2.5    ; 战斗层淡出（菜单可改）
fHandbackFade    = 2.5    ; 交还原版时的淡出：本插件淡出的同时，原版音乐接上（菜单可改）
fCombatHold      = 2.5    ; 战斗层保持时长：AI 战斗标记撤销后仍继续播放的秒数（菜单可改）
                          ; （收起武器、主动脱离会立刻结束，不必等这个值）
fWorldSettle     = 1.2    ; 载入后起播延迟：载入界面关闭且单元已加载后，还要稳定这么久
                          ; 才允许起播（菜单可改）

; ---- 换曲控制（菜单可改）：防止「刚进门就换曲」「两段音乐重叠」----
; 曲目最短播放时长：未达此时长不会被新场景替换（临近结尾时例外，那是自然交接）
fMinPlay         = 12.0
; 换曲判定延迟：新场景必须持续稳定这么久才算数（走过门、擦过单元边界不算）
fSwitchSettle    = 1.5
; 换曲最小间隔：同一层两次切换之间的硬性下限，交叉淡化期间绝不起新曲
fSwitchCooldown  = 4.0

[Behavior]
iRecentWindow      = 3    ; 曲目重复抑制窗口：多少首之内不重复（菜单可改）
iMinTracks         = 1    ; 有效曲目池下限：某层曲目少于此值视为空，播放权交还原版（菜单可改）
bSheatheEndsCombat = 1    ; 收起武器结束战斗事件；主动开战与遭遇伏击均适用（菜单可改）
                          ; 关闭后只能等 AI 战斗标记自行撤销，会拖到 fCombatHold 之后
iTickMs            = 50   ; 引擎调度周期（毫秒，重启生效）—— 仅 INI，不建议改
bSingleFormatCheck = 1    ; 同一目录混用 .xwm 与 .wav 时写一条日志 —— 仅 INI

[Vanilla]
; 本插件默认「接管」原版音乐：它替代原版音乐的播放。
;   bKeepVanilla = 0（默认）接管：
;       当前事件或地点有匹配曲目时，原版层音量归零（不叠加、不同时响）；
;       没有匹配曲目时，播放权交还原版（回退）。
;       —— 任何情况下都不会让游戏变成没有音乐。
;   bKeepVanilla = 1 保留原版：原版音乐照常播放，与本插件并行。
bKeepVanilla = 0

[UI]
; 界面语言由所安装的 dll 决定：中文版 CustomMusicSystem.dll /
; 英文版 CustomMusicSystem_en.dll（见 SKSE\Plugins\Language-EN\）。
; 这个键只为了兼容旧配置，读取后仅写进日志，不再影响界面。
sUILanguage = auto

; ---------------------------------------------------------------------------
; 曲库位置固定为 Data\Music\<事件目录>\，不可配置（目录保持只读）。
; ---------------------------------------------------------------------------
; 事件结束规则：
;   战斗层在事件结束时开始渐弱（fFadeCombatExit），到 0 后声部销毁，不是硬切。
;   事件结束 = 收起武器（0.5 秒确认）、主动脱离交战距离（3 秒确认），
;   或 AI 战斗标记撤销后经过 fCombatHold。
;   环境层在「本单元无匹配曲目」时同样渐弱（fHandbackFade），淡出同时交还原版。
; ---------------------------------------------------------------------------
